<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" fill="none">
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; }
  </style>
  <!-- Top: Brand Promise -->
  <rect x="100" y="0" width="300" height="60" rx="12" fill="#0D164F"/>
  <text x="250" y="22" text-anchor="middle" font-weight="600" fill="#58B6D2" font-size="9" text-transform="uppercase" letter-spacing="1">BRAND PROMISE</text>
  <text x="250" y="43" text-anchor="middle" font-weight="700" fill="#FFFBF5" font-size="16">Care. Clarified.</text>
  <!-- Connecting lines -->
  <line x1="175" y1="60" x2="95" y2="85" stroke="#58B6D2" stroke-width="1.5" opacity="0.3"/>
  <line x1="250" y1="60" x2="250" y2="85" stroke="#58B6D2" stroke-width="1.5" opacity="0.3"/>
  <line x1="325" y1="60" x2="405" y2="85" stroke="#58B6D2" stroke-width="1.5" opacity="0.3"/>
  <!-- Value Pillars -->
  <rect x="20" y="85" width="148" height="75" rx="10" fill="#EEF7FA" stroke="#58B6D2" stroke-width="1"/>
  <text x="94" y="110" text-anchor="middle" font-weight="700" fill="#0D164F" font-size="13">Understand</text>
  <text x="94" y="128" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.5" font-size="10">AI summaries in</text>
  <text x="94" y="141" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.5" font-size="10">plain language</text>
  <rect x="176" y="85" width="148" height="75" rx="10" fill="#EEF7FA" stroke="#58B6D2" stroke-width="1"/>
  <text x="250" y="110" text-anchor="middle" font-weight="700" fill="#0D164F" font-size="13">Remember</text>
  <text x="250" y="128" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.5" font-size="10">Never forget what</text>
  <text x="250" y="141" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.5" font-size="10">your doctor said</text>
  <rect x="332" y="85" width="148" height="75" rx="10" fill="#EEF7FA" stroke="#58B6D2" stroke-width="1"/>
  <text x="406" y="110" text-anchor="middle" font-weight="700" fill="#0D164F" font-size="13">Share</text>
  <text x="406" y="128" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.5" font-size="10">Care Circle for</text>
  <text x="406" y="141" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.5" font-size="10">family involvement</text>
  <!-- Connecting lines to audiences -->
  <line x1="94" y1="160" x2="70" y2="195" stroke="#D4A832" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="160" x2="190" y2="195" stroke="#D4A832" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="160" x2="310" y2="195" stroke="#D4A832" stroke-width="1" opacity="0.3"/>
  <line x1="406" y1="160" x2="430" y2="195" stroke="#D4A832" stroke-width="1" opacity="0.3"/>
  <!-- Audiences -->
  <rect x="10" y="195" width="110" height="50" rx="8" fill="#FBF6EA" stroke="#D4A832" stroke-width="1"/>
  <text x="65" y="216" text-anchor="middle" font-weight="700" fill="#0D164F" font-size="11">Patients</text>
  <text x="65" y="232" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.5" font-size="9">Understand + Remember</text>
  <rect x="130" y="195" width="110" height="50" rx="8" fill="#FBF6EA" stroke="#D4A832" stroke-width="1"/>
  <text x="185" y="216" text-anchor="middle" font-weight="700" fill="#0D164F" font-size="11">Caregivers</text>
  <text x="185" y="232" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.5" font-size="9">Share + Trust</text>
  <rect x="250" y="195" width="110" height="50" rx="8" fill="#FBF6EA" stroke="#D4A832" stroke-width="1"/>
  <text x="305" y="216" text-anchor="middle" font-weight="700" fill="#0D164F" font-size="11">Insurers</text>
  <text x="305" y="232" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.5" font-size="9">Outcomes + Scale</text>
  <rect x="370" y="195" width="110" height="50" rx="8" fill="#FBF6EA" stroke="#D4A832" stroke-width="1"/>
  <text x="425" y="216" text-anchor="middle" font-weight="700" fill="#0D164F" font-size="11">Providers</text>
  <text x="425" y="232" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.5" font-size="9">Informed patients</text>
  <!-- Source label -->
  <text x="250" y="280" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.3" font-size="9">Same pillars, different emphasis per audience</text>
</svg>
