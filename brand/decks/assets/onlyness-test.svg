<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" fill="none">
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; }
  </style>
  <!-- Venn-style overlap -->
  <circle cx="250" cy="110" r="95" fill="rgba(88,182,210,0.12)" stroke="#58B6D2" stroke-width="1.5"/>
  <circle cx="450" cy="110" r="95" fill="rgba(212,168,50,0.12)" stroke="#D4A832" stroke-width="1.5"/>
  <!-- Center overlap -->
  <text x="350" y="95" text-anchor="middle" font-weight="800" fill="#0D164F" font-size="16">ONLYNESS</text>
  <text x="350" y="115" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.5" font-size="11">What only YOU</text>
  <text x="350" y="130" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.5" font-size="11">can claim</text>
  <!-- Left label -->
  <text x="195" y="95" text-anchor="middle" font-weight="700" fill="#3A8FA8" font-size="12">What you</text>
  <text x="195" y="110" text-anchor="middle" font-weight="700" fill="#3A8FA8" font-size="12">do well</text>
  <!-- Right label -->
  <text x="505" y="95" text-anchor="middle" font-weight="700" fill="#A07E1F" font-size="12">What they</text>
  <text x="505" y="110" text-anchor="middle" font-weight="700" fill="#A07E1F" font-size="12">care about</text>
</svg>
