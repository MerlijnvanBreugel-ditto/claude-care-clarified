<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" fill="none">
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; }
    .step-label { font-weight: 700; fill: #0D164F; font-size: 11px; }
    .step-num { font-weight: 800; fill: #58B6D2; font-size: 20px; font-family: 'Inter', system-ui; }
    .step-sub { font-weight: 500; fill: #0D164F; opacity: 0.5; font-size: 9.5px; }
  </style>
  <!-- Step boxes -->
  <rect x="0" y="20" width="150" height="120" rx="12" fill="#EEF7FA" stroke="#58B6D2" stroke-width="1.5"/>
  <text x="75" y="55" text-anchor="middle" class="step-num">1</text>
  <text x="75" y="75" text-anchor="middle" class="step-label">Competitive</text>
  <text x="75" y="90" text-anchor="middle" class="step-label">Alternatives</text>
  <text x="75" y="115" text-anchor="middle" class="step-sub">What would they</text>
  <text x="75" y="128" text-anchor="middle" class="step-sub">do without you?</text>

  <rect x="185" y="20" width="150" height="120" rx="12" fill="#EEF7FA" stroke="#58B6D2" stroke-width="1.5"/>
  <text x="260" y="55" text-anchor="middle" class="step-num">2</text>
  <text x="260" y="75" text-anchor="middle" class="step-label">Unique</text>
  <text x="260" y="90" text-anchor="middle" class="step-label">Attributes</text>
  <text x="260" y="115" text-anchor="middle" class="step-sub">What do you have</text>
  <text x="260" y="128" text-anchor="middle" class="step-sub">that they lack?</text>

  <rect x="370" y="20" width="150" height="120" rx="12" fill="#EEF7FA" stroke="#58B6D2" stroke-width="1.5"/>
  <text x="445" y="55" text-anchor="middle" class="step-num">3</text>
  <text x="445" y="75" text-anchor="middle" class="step-label">Customer</text>
  <text x="445" y="90" text-anchor="middle" class="step-label">Value</text>
  <text x="445" y="115" text-anchor="middle" class="step-sub">So what?</text>
  <text x="445" y="128" text-anchor="middle" class="step-sub">Why does it matter?</text>

  <rect x="555" y="20" width="150" height="120" rx="12" fill="#EEF7FA" stroke="#58B6D2" stroke-width="1.5"/>
  <text x="630" y="55" text-anchor="middle" class="step-num">4</text>
  <text x="630" y="75" text-anchor="middle" class="step-label">Best-Fit</text>
  <text x="630" y="90" text-anchor="middle" class="step-label">Customers</text>
  <text x="630" y="115" text-anchor="middle" class="step-sub">Who cares</text>
  <text x="630" y="128" text-anchor="middle" class="step-sub">most?</text>

  <rect x="740" y="20" width="150" height="120" rx="12" fill="#0D164F" stroke="none"/>
  <text x="815" y="55" text-anchor="middle" font-weight="800" fill="#58B6D2" font-size="20" font-family="Inter, system-ui">5</text>
  <text x="815" y="75" text-anchor="middle" font-weight="700" fill="#FFFBF5" font-size="11" font-family="Inter, system-ui">Market</text>
  <text x="815" y="90" text-anchor="middle" font-weight="700" fill="#FFFBF5" font-size="11" font-family="Inter, system-ui">Category</text>
  <text x="815" y="115" text-anchor="middle" font-weight="500" fill="#FFFBF5" opacity="0.6" font-size="9.5" font-family="Inter, system-ui">What context makes</text>
  <text x="815" y="128" text-anchor="middle" font-weight="500" fill="#FFFBF5" opacity="0.6" font-size="9.5" font-family="Inter, system-ui">your value obvious?</text>

  <!-- Arrows -->
  <path d="M155 80 L180 80" stroke="#58B6D2" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M340 80 L365 80" stroke="#58B6D2" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M525 80 L550 80" stroke="#58B6D2" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M710 80 L735 80" stroke="#58B6D2" stroke-width="2" marker-end="url(#a2)"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58B6D2"/>
    </marker>
  </defs>
</svg>
