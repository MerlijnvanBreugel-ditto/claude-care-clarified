<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" fill="none">
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; }
  </style>
  <!-- Gradient bar -->
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58B6D2" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#58B6D2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4A832" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect x="40" y="35" width="620" height="40" rx="20" fill="url(#vg)" stroke="#58B6D2" stroke-width="1"/>
  <!-- Endpoints -->
  <text x="40" y="25" font-weight="700" fill="#3A8FA8" font-size="11">CLINICAL</text>
  <text x="40" y="95" font-weight="500" fill="#0D164F" opacity="0.4" font-size="10">B2B / Insurer</text>
  <text x="620" y="25" text-anchor="end" font-weight="700" fill="#A07E1F" font-size="11">WARM</text>
  <text x="620" y="95" text-anchor="end" font-weight="500" fill="#0D164F" opacity="0.4" font-size="10">Onboarding / Care Circle</text>
  <!-- Markers along the bar -->
  <circle cx="100" cy="55" r="5" fill="#3A8FA8"/>
  <text x="100" y="110" text-anchor="middle" font-weight="600" fill="#0D164F" font-size="9">Error</text>
  <circle cx="220" cy="55" r="5" fill="#4A9DB5"/>
  <text x="220" y="110" text-anchor="middle" font-weight="600" fill="#0D164F" font-size="9">Summary</text>
  <circle cx="350" cy="55" r="5" fill="#0D164F"/>
  <text x="350" y="110" text-anchor="middle" font-weight="700" fill="#0D164F" font-size="9">Marketing</text>
  <circle cx="480" cy="55" r="5" fill="#C49A28"/>
  <text x="480" y="110" text-anchor="middle" font-weight="600" fill="#0D164F" font-size="9">Care Circle</text>
  <circle cx="580" cy="55" r="5" fill="#D4A832"/>
  <text x="580" y="110" text-anchor="middle" font-weight="600" fill="#0D164F" font-size="9">Onboarding</text>
  <!-- Center label -->
  <text x="350" y="20" text-anchor="middle" font-weight="500" fill="#0D164F" opacity="0.35" font-size="10">ONE VOICE &mdash; MANY TONES</text>
</svg>
