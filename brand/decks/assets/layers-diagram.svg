<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; }
    .label { font-weight: 700; fill: #0D164F; font-size: 15px; }
    .sublabel { font-weight: 500; fill: #0D164F; opacity: 0.5; font-size: 12px; }
    .ring-text { font-weight: 600; fill: #0D164F; font-size: 13px; }
  </style>
  <!-- Concentric rings — outside in -->
  <ellipse cx="300" cy="250" rx="280" ry="220" fill="#EEF7FA" stroke="#58B6D2" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="300" cy="250" rx="225" ry="178" fill="#F3F8FA" stroke="#58B6D2" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="300" cy="250" rx="170" ry="136" fill="#F8FAFB" stroke="#58B6D2" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="300" cy="250" rx="115" ry="94" fill="#FAFCFD" stroke="#58B6D2" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="300" cy="250" rx="60" ry="52" fill="#0D164F" stroke="none"/>
  <!-- Center label -->
  <text x="300" y="246" text-anchor="middle" fill="#FFFBF5" font-weight="700" font-size="14" font-family="Inter, system-ui">Purpose</text>
  <text x="300" y="262" text-anchor="middle" fill="#58B6D2" font-weight="500" font-size="10" font-family="Inter, system-ui">WHY</text>
  <!-- Ring labels -->
  <text x="300" y="170" text-anchor="middle" class="ring-text">Positioning</text>
  <text x="300" y="184" text-anchor="middle" class="sublabel">FOR WHOM</text>
  <text x="300" y="100" text-anchor="middle" class="ring-text">Personality</text>
  <text x="300" y="114" text-anchor="middle" class="sublabel">HOW WE SHOW UP</text>
  <text x="300" y="54" text-anchor="middle" class="ring-text">Expression</text>
  <text x="300" y="68" text-anchor="middle" class="sublabel">WHAT THEY SEE &amp; HEAR</text>
  <!-- Experience at the outer edge -->
  <text x="300" y="475" text-anchor="middle" class="ring-text">Experience</text>
  <text x="300" y="489" text-anchor="middle" class="sublabel">WHAT THEY FEEL</text>
  <!-- Arrows pointing inward -->
  <path d="M300 440 L300 310" stroke="#58B6D2" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58B6D2" opacity="0.6"/>
    </marker>
  </defs>
</svg>
